name: Deploy to VPS (RealSolutions) - Improved

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-realsolutions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy over SSH (safer approach)
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -euo pipefail

            # === paths & variables ===
            SITE_DIR="/home/realsolutions/htdocs/www.realsolutions.ai"
            KEEP_CONFIG="/home/realsolutions/wp-config.php"
            DOMAIN="www.realsolutions.ai"

            cd "$SITE_DIR"

            # 1) Backup current wp-config if it exists
            if [ -f wp-config.php ] && [ ! -f "$KEEP_CONFIG" ]; then
              cp wp-config.php "$KEEP_CONFIG"
            fi

            # 2) Fetch latest changes (safer than hard reset)
            git fetch origin main

            # 3) Check if we can merge cleanly
            if git merge-base --is-ancestor HEAD origin/main; then
              echo "Fast-forward merge possible"
              git merge origin/main
            else
              echo "Force updating to match origin/main"
              git reset --hard origin/main
            fi

            # 4) Selective clean (SAFER - excludes more critical files)
            git clean -fd \
              -e wp-config.php \
              -e wp-content/uploads/ \
              -e wp-content/cache/ \
              -e wp-content/w3tc-config/ \
              -e wp-content/backup*/ \
              -e .htaccess \
              -e wp-content/debug.log \
              -e wp-content/advanced-cache.php \
              -e wp-content/object-cache.php

            # 5) Restore wp-config if needed
            if [ ! -f wp-config.php ] && [ -f "$KEEP_CONFIG" ]; then
              cp "$KEEP_CONFIG" wp-config.php
            fi

            # 6) Set ownership first
            chown -R realsolutions:realsolutions .

            # 7) Basic permissions (simplified)
            find . -type d -exec chmod 755 {} \;
            find . -type f -exec chmod 644 {} \;

            # 8) Special permissions for wp-content
            if [ -d wp-content ]; then
              find wp-content -type d -exec chmod 775 {} \;
              find wp-content -type f -exec chmod 664 {} \;
            fi

            # 9) Secure wp-config
            if [ -f wp-config.php ]; then
              chmod 640 wp-config.php
            fi

            # 10) Service reloads (with better error handling)
            echo "Reloading services..."
            
            # Try different PHP-FPM versions
            if systemctl is-active --quiet php8.1-fpm; then
              sudo systemctl reload php8.1-fpm
            elif systemctl is-active --quiet php8.0-fpm; then
              sudo systemctl reload php8.0-fpm  
            elif systemctl is-active --quiet php-fpm; then
              sudo systemctl reload php-fpm
            fi

            # Reload nginx
            if systemctl is-active --quiet nginx; then
              sudo systemctl reload nginx
            fi

            # Varnish cache clear (if available)
            if command -v varnishadm >/dev/null 2>&1; then
              sudo varnishadm "ban req.http.host ~ ${DOMAIN}" || echo "Varnish ban failed, continuing..."
            fi

            echo "Deployment completed successfully!"